<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title> Misión y Visión - Complejo educativo Juan Germán Roscio</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --azul-header: #133260;
      --crema-fondo: #fdf8f0;
      --texto-principal: #2d2d2d;
      --dorado-link: #d2bc7a
    }

    html, body {
      width:100%;
      background-color: var(--crema-fondo);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--texto-principa);
      line-height:1.6;
    }

    header {
      background-color: var(--azul-header);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4%;
      height: 70px;
      width: 100%;
    }

    header nav {
      display: flex;
      align-items: center;
    }

    .menu-toggle {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .menu-toggle span {
      background-color: #ffffff;
      width: 24px;
      height: 2.5px;
      display: block;
    }

    
      </style>
</head>
